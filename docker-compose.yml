services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: upiresolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: upiresolve
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U upiresolve"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://upiresolve:${POSTGRES_PASSWORD}@db:5432/upiresolve
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads, models:/app/model_store]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}" }
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: { pgdata: {}, uploads: {}, models: {} }
